[project]
name = "geometrydash"
version = "0.2.0"
description = "Geometry Dash game in Python — pygame edition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5",
]

[project.scripts]
geometrydash = "geometrydash.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
